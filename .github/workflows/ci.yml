name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: financial_test
          POSTGRES_USER: financial_test
          POSTGRES_PASSWORD: ci-only-local-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U financial_test -d financial_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FINANCIAL_TEST_CONNECTION: Host=localhost;Port=5432;Database=financial_test;Username=financial_test;Password=ci-only-local-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Financial.slnx
      - run: dotnet build Financial.slnx --no-restore -c Release
      - run: dotnet test Financial.slnx --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
